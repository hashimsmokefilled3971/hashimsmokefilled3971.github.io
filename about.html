<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT NAME | Official Site</title>
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181f;
      --text: #e6e8ec;
      --accent: #6c5ce7;
      --subtext: #8c909e;
      --border: #232733;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 0 20px 80px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    header {
      padding: 80px 0 40px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .tagline {
      color: var(--subtext);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
    section {
      margin-top: 48px;
    }
    h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--subtext);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    /* Player Card */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .track-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .track-title { font-size: 1.1rem; font-weight: 600; }
    .track-status { font-size: 0.8rem; color: var(--accent); }
    audio {
      width: 100%;
      height: 36px;
      filter: invert(0.85); /* ブラウザ標準プレイヤーをダーク調になじませる */
    }
    /* Link List */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .link-item {
      display: block;
      text-align: center;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: border-color 0.2s, transform 0.1s;
    }
    .link-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    /* About & Lyrics */
    .text-block {
      color: #c0c4cc;
      font-size: 0.95rem;
      white-space: pre-line;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>PROJECT NAME</h1>
      <p class="tagline">Sound / Atmosphere / Concept</p>
    </header>

    <!-- 音源セクション -->
    <section>
      <h2>Featured Track</h2>
      <div class="player-card">
        <div class="track-meta">
          <span class="track-title">Track Title</span>
          <span class="track-status">New Release</span>
        </div>
        <!-- 自前MP3を鳴らす場合（audioフォルダ等に配置） -->
        <audio controls src="audio/track.mp3"></audio>
        
        <!-- または Spotify / SoundCloud の埋め込みコード（iframe）を置くことも可能 -->
      </div>
    </section>

    <!-- コンセプト・About -->
    <section>
      <h2>About & Concept</h2>
      <div class="text-block">
夜の街並みやネオンの光、感情の移ろいを音と言葉に落とし込むプロジェクト。
ここに楽曲の背景や、音作りで目指しているビジョン・コンセプトを数行で簡潔に記載します。
      </div>
    </section>

    <!-- 配信・外部リンク -->
    <section>
      <h2>Platforms & Links</h2>
      <div class="links-grid">
        <a href="#" class="link-item" target="_blank" rel="noopener">Spotify</a>
        <a href="#" class="link-item" target="_blank" rel="noopener">Apple Music</a>
        <a href="#" class="link-item" target="_blank" rel="noopener">YouTube</a>
        <a href="#" class="link-item" target="_blank" rel="noopener">SoundCloud</a>
        <a href="#" class="link-item" target="_blank" rel="noopener">X (Twitter)</a>
      </div>
    </section>
  </div>

</body>
</html>
