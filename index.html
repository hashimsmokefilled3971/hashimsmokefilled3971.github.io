<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT NAME | Official Hub</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #15171e;
      --card-hover: #1c1f29;
      --border: #232734;
      --text-main: #f0f2f5;
      --text-muted: #8b92a5;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px 80px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ヘッダー・アートワーク */
    .hero {
      text-align: center;
    }

    .artwork-frame {
      width: 220px;
      height: 220px;
      margin: 0 auto 24px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 24px var(--accent-glow);
      border: 1px solid var(--border);
      background-color: #121318;
    }

    .artwork-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .project-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 0.06em;
    }

    /* セクション共通ラベル */
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    /* 自前MP3プレイヤーカード */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .track-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .track-tag {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(124, 92, 255, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* ネイティブオーディオのダーク調フィルタ調整 */
    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      filter: invert(0.9) hue-rotate(180deg);
    }

    /* 配信リンクボタングリッド */
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stream-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .stream-link:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .platform-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* アイコン用インラインSVGコンテナ */
    .platform-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .stream-link:hover .action-text {
      color: var(--text-main);
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    /* フッター */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ヘッダー / アートワーク -->
    <header class="hero">
      <div class="artwork-frame">
        <!-- images/jacket.jpg に差し替えるか、仮画像URLを指定 -->
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&auto=format&fit=crop&q=80" alt="Cover Art">
      </div>
      <h1 class="project-title">PROJECT NAME</h1>
      <p class="project-subtitle">Sound / Production / Atmosphere</p>
    </header>

    <!-- 自前MP3プレイヤーセクション -->
    <section>
      <div class="section-label">Direct Audio Stream</div>
      <div class="player-card">
        <div class="track-meta">
          <span class="track-title">Featured Track</span>
          <span class="track-tag">MP3 High-Res</span>
        </div>
        <!-- audioフォルダ内のMP3パスを指定 -->
        <audio controls preload="metadata">
          <source src="audio/track.mp3" type="audio/mpeg">
          お使いのブラウザはオーディオ再生に対応していません。
        </audio>
      </div>
    </section>

    <!-- 各種ストリーミング配信リンク -->
    <section>
      <div class="section-label">Streaming & Download</div>
      <div class="links-grid">

          <span class="action-text">Listen</span>
        </a>

        <!-- Apple Music -->

            </span>
            <span>SoundCloud</span>
          </div>
          <span class="action-text">Stream</span>
        </a>

        <!-- YouTube / YouTube Music -->
        <a href="https://youtube.com/" target="_blank" rel="noopener" class="stream-link">
          <div class="platform-info">
            <span class="platform-icon">
              <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

        </a>

      </div>
    </section>

    <!-- フッター -->
    <footer>
      <p>&copy; 2026 PROJECT NAME. All Rights Reserved.</p>
    </footer>

  </div>

</body>
</html>
